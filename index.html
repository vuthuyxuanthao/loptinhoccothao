<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot NAO cho Google Site</title>
    

    <style>
        /* Đảm bảo toàn bộ trang HTML con chỉ hiển thị chatbot */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Ngăn cuộn trang HTML này */
            font-family: Arial, sans-serif;
        }

        /* Khung chứa chatbot chính, tương tự như cũ nhưng không fixed vì nằm trong iframe */
        .chatbot-container {
            position: absolute; /* Sử dụng absolute thay vì fixed để hoạt động tốt trong iframe */
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }

        /* Nút Mở/Đóng Chatbot */
        .chatbot-toggle-button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #007bff; /* Màu xanh nổi bật */
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .robot-icon {
            font-size: 32px;
            line-height: 1;
        }

        /* Cửa sổ Chatbot chính */
        .chatbot-window {
            width: 320px;
            height: 400px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chatbot-header {
            background-color: #28a745;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .chatbot-content {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            background-color: #f8f9fa;
            display: flex; /* Bật Flexbox để tin nhắn xếp chồng */
            flex-direction: column;
        }
        
        /* CSS cho Tin nhắn */
        .bot-message, .user-message {
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
        }

        .bot-message {
            background-color: #e6f7ff;
            align-self: flex-start;
            margin-right: auto;
        }

        .user-message {
            background-color: #d1ffc9;
            align-self: flex-end;
            margin-left: auto;
            text-align: right;
        }
        /* Kết thúc CSS Tin nhắn */

        /* Khung nhập liệu */
        .chatbot-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
            background-color: #f1f1f1;
        }

        .chatbot-input input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        .chatbot-input button {
            padding: 8px 15px;
            border: none;
            background-color: #28a745;
            color: white;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
            font-weight: bold;
            transition: background-color 0.2s;
            min-width: 60px;
        }

        /* Nút Gửi khi đang chờ (đếm ngược) */
        .chatbot-input button:disabled,
        .chatbot-input input:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
        }
        .chatbot-input input:disabled { background-color: #eeeeee; }

        /* Khi lớp 'open' được thêm vào, cửa sổ sẽ hiển thị */
        .chatbot-container.open .chatbot-window {
            display: flex;
        }
    </style>
</head>
<body>

    <div id="naoChatbotContainer" class="chatbot-container open">

        <div id="naoChatbotWindow" class="chatbot-window">
            <div class="chatbot-header">🤖 Robot NAO - Công dân số</div>
            <div id="chatbotContent" class="chatbot-content">
                <p class="bot-message">🤖 NAO: Chào bạn! Tớ là NAO, robot thông minh giúp bạn học về Kỹ năng Công dân số. Bạn muốn hỏi tớ điều gì?</p>
            </div>
            
            <div class="chatbot-input">
                <input type="text" id="userInput" placeholder="Hỏi NAO về an toàn mạng..." />
                <button id="sendButton">Gửi</button>
            </div>
        </div>

        <button id="naoChatbotToggle" class="chatbot-toggle-button">
            <span class="robot-icon">🤖</span>
        </button>
    </div>

    <script src="chatbot-logic.js" type="module"></script>
</body>
</html>
